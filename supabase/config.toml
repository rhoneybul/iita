# Supabase project config for iita.
#
# `supabase start` boots a local stack from this file. `supabase db push`
# uses [db] to apply migrations to your linked remote project.

project_id = "iita"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
# Note: production auth (Google / Apple providers, redirect URLs) is
# configured in the Supabase dashboard, not in this file. Local-stack
# auth runs in email-only mode by default.
site_url = "iita://"
additional_redirect_urls = ["iita://auth/callback", "http://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = false
